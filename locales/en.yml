en:
  theme_metadata:
    description: "Modernes Discourse-Theme für das TK Forum. Design: Miriam Boxleitner, Umsetzung: Adrian Zillner."
    settings:
      brand_name: "Wortmarke, die im Header rechts neben dem Logo-Zeichen steht."
      replace_logo: "Ersetzt das Standard-Logo von Discourse durch das TK-Logo-Zeichen mit Wortmarke."
      show_top_nav: "Blendet eine zentrierte Navigation im Header ein."
      nav_links: "Links der Header-Navigation. Ein Link pro Zeile im Format Titel,URL. Mit dem optionalen dritten Feld _blank öffnet sich der Link in einem neuen Tab. Beispiel: Shop,https://www.thomas-krenn.com,_blank"
      login_button_text: "Text des Anmelde-Buttons im Header."
      signup_button_text: "Text des Registrierungs-Buttons im Header."
      custom_font_variable: "Optional: Variable Font, der alle Schriftgewichte abdeckt. Wird als ‚TK Theme Font‘ eingebunden. Ersetzt die einzelnen Schriftdateien unten."
      custom_font_regular: "Optional: Schriftdatei für das Gewicht 400 (Regular)."
      custom_font_medium: "Optional: Schriftdatei für das Gewicht 500 (Medium)."
      custom_font_bold: "Optional: Schriftdatei für das Gewicht 700 (Bold)."
      custom_homepage_enabled: "Zeigt auf der Startseite statt der normalen Themenliste die Landing-Page mit Hero, Kategorien, News und Teaser. Wenn die Option aus ist, wird auf die Standard-Startseite weitergeleitet."
      latest_teaser_count: "Anzahl der Themen im Teaser ‚Letzte Beiträge‘ auf der Startseite. Bei 0 wird der Teaser ausgeblendet."
      teaser_prefer_name: "Zeigt im Teaser den Klarnamen der Autoren statt @Benutzername, sofern einer hinterlegt ist."
      hero_heading_accent: "Erster Teil der Hero-Überschrift, in Orange hervorgehoben."
      hero_heading_rest: "Zweiter Teil der Hero-Überschrift, in Weiß."
      search_style: "Art der Suche im Hero. native: echte Discourse-Suche mit Live-Ergebnissen. simple: einfaches Eingabefeld, das die Volltextsuche unter /search öffnet."
      hero_search_placeholder: "Platzhaltertext im Suchfeld des Hero. Gilt für beide Arten der Suche."
      show_hero_on_discovery: "Zeigt den Hero zusätzlich über den Themenlisten an (/latest, /categories usw.)."
      home_paths: "Routen, die als Startseite der Themenliste gelten. Darauf beziehen sich show_hero_on_discovery, hide_list_nav_on_home und hide_sidebar_on_home."
      hide_list_nav_on_home: "Blendet auf diesen Routen die Navigationsleiste und die Filter von Discourse aus."
      hide_sidebar_on_home: "Blendet auf diesen Routen die linke Sidebar aus. Standardmäßig aus, damit die Sidebar und der Admin-Bereich erreichbar bleiben."
      show_latest_section_title: "Zeigt eine Überschrift über der Themenliste an."
      latest_section_title: "Text der Überschrift über der Themenliste, z. B. ‚Letzte Beiträge‘."
      enable_icon_replacements: "Schaltet die Icon-Ersetzung (icon_replacements) ein. Standardmäßig aus. Erst einschalten, wenn alle eigenen Icons im Sprite liegen, sonst bleiben die betroffenen Icons leer."
      icon_replacements: "Ersetzt Standard-Icons von Discourse überall durch eigene Symbole aus dem Sprite. Ein Eintrag pro Zeile im Format discourse-name,tk-name. Voraussetzung: Das Symbol liegt in assets/icons/tk-icons.svg (z. B. mit icon-manager.html angelegt) und ist in der Site-Einstellung svg_icon_subset eingetragen. Wirkt nur, wenn enable_icon_replacements eingeschaltet ist."