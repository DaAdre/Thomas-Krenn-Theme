en:
  theme_metadata:
    description: "Dunkles, kartenbasiertes Discourse-Theme fuer herstellerunabhaengige IT-Infrastruktur-Foren. Custom Homepage mit Hero und echter Forensuche, plus Outlets fuer die Komponenten TK Kategorien und TK News."
    settings:
      brand_name: "Wortmarke rechts neben dem Logo-Zeichen im Header."
      replace_logo: "Das Discourse-Logo durch das TK-Logo-Zeichen plus Wortmarke ersetzen."
      show_top_nav: "Zentrierte Kopf-Navigation im Header anzeigen."
      nav_links: "Kopf-Navigationslinks. Ein Eintrag pro Zeile: Titel,URL - optionales drittes Feld _blank oeffnet einen neuen Tab."
      login_button_text: "Beschriftung des Anmelden-Buttons im Header."
      signup_button_text: "Beschriftung des Beitreten-Buttons im Header."
      custom_font_variable: "Optional: Variable-Font hochladen (deckt alle Gewichte ab). Wird als 'TK Theme Font' eingebunden."
      custom_font_regular: "Optional: eigene Schrift Gewicht 400 (Regular)."
      custom_font_medium: "Optional: eigene Schrift Gewicht 500 (Medium)."
      custom_font_bold: "Optional: eigene Schrift Gewicht 700 (Bold)."
      custom_homepage_enabled: "Startseite / zeigt die Landing-Page (Hero, Kategorien, News, Teaser) statt der Themenliste. Aus = Weiterleitung auf die normale Startliste."
      latest_teaser_count: "Anzahl der Themen im 'Letzte Beitraege'-Teaser der Startseite (0 = aus)."
      teaser_prefer_name: "Autoren im Teaser mit Klarnamen statt @Username anzeigen (falls hinterlegt)."
      hero_heading_accent: "Erster, orange hervorgehobener Teil der Hero-Ueberschrift."
      hero_heading_rest: "Zweiter, weisser Teil der Hero-Ueberschrift."
      search_style: "native = echte Discourse-Suche mit Live-Ergebnissen (SearchMenu). simple = Eingabefeld, das die Volltextsuche /search oeffnet."
      hero_search_placeholder: "Platzhaltertext des Suchfelds im Hero (gilt fuer beide Such-Varianten)."
      show_hero_on_discovery: "Den Hero zusaetzlich auf den Forenlisten (/latest, /categories …) einblenden."
      home_paths: "Routen, die als Forenliste-Startseite gelten (fuer show_hero_on_discovery)."
      hide_list_nav_on_home: "Discourse-Navigationsleiste/Filter auf diesen Routen ausblenden."
      hide_sidebar_on_home: "Die linke Discourse-Sidebar auf diesen Routen ausblenden. Standard: aus (Sidebar sichtbar, inkl. Admin-Panel)."
      show_latest_section_title: "Ueberschrift ueber der Themenliste anzeigen."
      latest_section_title: "Text dieser Ueberschrift, z. B. Letzte Beitraege."
