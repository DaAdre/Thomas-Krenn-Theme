# =============================================================================
#  TK Forum – IT-Infrastruktur Community  ·  Theme-Einstellungen
#
#  Kategorien-Panel + Kategorienseite -> Komponente "TK Kategorien"
#  News-/Event-Banner                 -> Komponente "TK News"
#  Beide rendern in Outlets, die dieses Theme bereitstellt
#  (tk-hero-aside, tk-hero-news).
# =============================================================================

svg_icons:
  type: list
  list_type: compact
  default: "tk-server|tk-storage|tk-network|tk-edge|tk-linux|tk-virt|tk-automation|tk-ops|tk-chip|tk-shield|tk-cloud|tk-wrench|tk-book|tk-chat|tk-default|tk-support|tk-calendar|tk-team"

# ---- Header / Logo ---------------------------------------------------------
brand_name:
  type: string
  default: "forum"

replace_logo:
  type: bool
  default: true

show_top_nav:
  type: bool
  default: true

nav_links:
  type: list
  list_type: simple
  default: "Kategorien,/categories|Forum,/latest|Aktuelles,/tag/aktuelles|Über uns,/about"

login_button_text:
  type: string
  default: "Anmelden"

signup_button_text:
  type: string
  default: "Beitreten"

# ---- Custom Fonts -------------------------------------------------------
# Standard: mitgelieferte Schrift aus assets/fonts/ (in about.json registriert).
# Alternative: eigene Schrift hier hochladen (wird als "TK Theme Font"
# eingebunden). Siehe assets/fonts/README.md.
custom_font_variable:
  type: upload
  default: ""

custom_font_regular:
  type: upload
  default: ""

custom_font_medium:
  type: upload
  default: ""

custom_font_bold:
  type: upload
  default: ""

# ---- Startseite (Custom Homepage) ------------------------------------------
# Das Theme setzt den Modifier `custom_homepage` -> "/" zeigt die Landing-Page
# statt der Themenliste. Das eigentliche Forum liegt unter /latest, /categories …
custom_homepage_enabled:
  type: bool
  default: true

latest_teaser_count:
  type: integer
  default: 6
  min: 0
  max: 20

# Autoren im Teaser mit Klarnamen statt @Username anzeigen (falls gesetzt)
teaser_prefer_name:
  type: bool
  default: false

# ---- Hero ----------------------------------------------------------------
hero_heading_accent:
  type: string
  default: "Herstellerunabhängiger Fachaustausch"

hero_heading_rest:
  type: string
  default: "für alle, die professionelle IT-Infrastruktur betreiben."

# "native" = echte Discourse-Suche (SearchMenu, Live-Ergebnisse)
# "simple" = Eingabefeld, das die Volltextsuche /search oeffnet
search_style:
  type: enum
  default: native
  choices:
    - native
    - simple

hero_search_placeholder:
  type: string
  default: "Welche Frage hast du heute? z.B. ZFS, VLAN, Ansible, …"

# Hero zusätzlich auf den Forenlisten (/latest, /categories …) einblenden
show_hero_on_discovery:
  type: bool
  default: false

home_paths:
  type: list
  list_type: simple
  default: "/|/latest|/categories|/top|/hot|/new|/unread"

# ---- Feinschliff der Forenlisten -------------------------------------
hide_list_nav_on_home:
  type: bool
  default: true

# Standard: aus -> die Discourse-Sidebar bleibt sichtbar (Admin-Panel usw.).
hide_sidebar_on_home:
  type: bool
  default: false

show_latest_section_title:
  type: bool
  default: true

latest_section_title:
  type: string
  default: "Letzte Beiträge"
