# =============================================================================
#  TK Forum – IT-Infrastruktur Community  ·  Theme-Einstellungen
#
#  Kategorien-Panel + Kategorienseite -> Komponente "TK Kategorien"
#  News-/Event-Banner                 -> Komponente "TK News"
#  Beide rendern in Outlets, die dieses Theme bereitstellt
#  (tk-hero-aside, tk-hero-news).
# =============================================================================

svg_icons:
  type: list
  list_type: compact
  default: "tk-server|tk-storage|tk-network|tk-edge|tk-linux|tk-virt|tk-automation|tk-ops|tk-chip|tk-shield|tk-cloud|tk-wrench|tk-book|tk-chat|tk-default|tk-support|tk-calendar|tk-team"

# ---- Header / Logo ---------------------------------------------------------
brand_name:
  type: string
  default: "forum"

#replace_logo:
#  type: bool
#  default: false

show_top_nav:
  type: bool
  default: true

nav_links:
  type: list
  list_type: simple
  default: "Kategorien,/categories|Forum,/latest|Aktuelles,/tag/aktuelles|Über uns,/about"

login_button_text:
  type: string
  default: "Anmelden"

signup_button_text:
  type: string
  default: "Beitreten"

# ---- Custom Fonts -------------------------------------------------------
# Standard: mitgelieferte Schrift aus assets/fonts/ (in about.json registriert).
# Alternative: eigene Schrift hier hochladen (wird als "TK Theme Font"
# eingebunden). Siehe assets/fonts/README.md.
custom_font_variable:
  type: upload
  default: ""

custom_font_regular:
  type: upload
  default: ""

custom_font_medium:
  type: upload
  default: ""

custom_font_bold:
  type: upload
  default: ""

# ---- Startseite (Custom Homepage) ------------------------------------------
# Das Theme setzt den Modifier `custom_homepage` -> "/" zeigt die Landing-Page
# statt der Themenliste. Das eigentliche Forum liegt unter /latest, /categories …
custom_homepage_enabled:
  type: bool
  default: true

latest_teaser_count:
  type: integer
  default: 6
  min: 0
  max: 20

# Autoren im Teaser mit Klarnamen statt @Username anzeigen (falls gesetzt)
teaser_prefer_name:
  type: bool
  default: false

# ---- Hero ----------------------------------------------------------------
hero_heading_accent:
  type: string
  default: "Herstellerunabhängiger Fachaustausch"

hero_heading_rest:
  type: string
  default: "für alle, die professionelle IT-Infrastruktur betreiben."

# "native" = echte Discourse-Suche (SearchMenu, Live-Ergebnisse)
# "simple" = Eingabefeld, das die Volltextsuche /search oeffnet
search_style:
  type: enum
  default: native
  choices:
    - native
    - simple

hero_search_placeholder:
  type: string
  default: "Welche Frage hast du heute? z.B. ZFS, VLAN, Ansible, …"

# Hero zusätzlich auf den Forenlisten (/latest, /categories …) einblenden
show_hero_on_discovery:
  type: bool
  default: false

home_paths:
  type: list
  list_type: simple
  default: "/|/latest|/categories|/top|/hot|/new|/unread"

# ---- Feinschliff der Forenlisten -------------------------------------
hide_list_nav_on_home:
  type: bool
  default: true

# Standard: aus -> die Discourse-Sidebar bleibt sichtbar (Admin-Panel usw.).
hide_sidebar_on_home:
  type: bool
  default: false

show_latest_section_title:
  type: bool
  default: true

latest_section_title:
  type: string
  default: "Letzte Beiträge"

# ---- Marken-Icons: Discourse-Standard-Icons global ersetzen -----------
# Standardmaessig AUS, solange die eigenen Icons noch nicht im Sprite
# liegen - erst einschalten, wenn assets/icons/tk-icons.svg befuellt ist
# (siehe assets/icons/README.md, Abschnitt 5), sonst bleiben betroffene
# Icons leer.
enable_icon_replacements:
  type: bool
  default: false

# Ein Eintrag pro Zeile: "Discourse-Icon-Name,eigener-Sprite-Name". Jeder
# eigene Name muss als <symbol> in assets/icons/tk-icons.svg liegen (z. B.
# per icon-manager.html ergaenzt) UND in der Site-Einstellung
# svg_icon_subset stehen - siehe assets/icons/README.md. Fehlt ein Symbol
# noch im Sprite, bleibt an der Stelle nur eine leere Flaeche (kein Fehler) -
# also gefahrlos nach und nach ergaenzbar.
icon_replacements:
  type: list
  list_type: compact
  default: "bars,tk-menu|magnifying-glass,tk-search|bell,tk-bell|circle-user,tk-user|user,tk-user|gear,tk-settings|house,tk-home|d-chat,tk-message|comment,tk-message|reply,tk-reply|heart,tk-heart|bookmark,tk-bookmark|share-nodes,tk-share|flag,tk-flag|ellipsis,tk-more|ellipsis-vertical,tk-more|link,tk-link|pencil,tk-edit|trash-can,tk-trash|plus,tk-plus|xmark,tk-close|check,tk-check|thumbtack,tk-pin|envelope,tk-mail|eye,tk-eye|eye-slash,tk-eye-slash|lock,tk-lock|chevron-down,tk-chevron-down|chevron-up,tk-chevron-up|chevron-left,tk-chevron-left|chevron-right,tk-chevron-right|angle-down,tk-chevron-down|angle-up,tk-chevron-up|caret-down,tk-caret-down|caret-right,tk-caret-right|arrow-left,tk-arrow-left|arrow-right,tk-arrow-right|arrow-up,tk-arrow-up|arrow-down,tk-arrow-down|circle-exclamation,tk-warning|triangle-exclamation,tk-warning|circle-info,tk-info|circle-question,tk-question|clock,tk-clock|calendar-days,tk-calendar|file-lines,tk-file|image,tk-image|paperclip,tk-attachment|code,tk-code|quote-right,tk-quote|bold,tk-bold|italic,tk-italic|list-ul,tk-list|list-ol,tk-list-numbered|table,tk-table|shield-halved,tk-shield|wrench,tk-wrench|gavel,tk-gavel|ban,tk-ban|users,tk-team|star,tk-star|upload,tk-upload|download,tk-download|rotate,tk-refresh|copy,tk-copy|print,tk-print"
